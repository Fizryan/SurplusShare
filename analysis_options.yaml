include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - .dart_tool/**
    - .idea/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    - windows/**
    - linux/**
    - macos/**
    - web/**

linter:
  rules:
    public_member_api_docs: false
    prefer_single_quotes: true
